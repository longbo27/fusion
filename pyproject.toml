[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focusstack"
version = "0.1.0"
description = "Bounded-memory photographic focus stacking"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "opencv-python-headless>=4.8,<5",
  "tifffile>=2024.8.30", "imagecodecs>=2024.6.1",
  "psutil>=5.9", "tqdm>=4.66"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
focusstack = "focusstack.cli:main"

[tool.setuptools.packages.find]
include = ["focusstack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
